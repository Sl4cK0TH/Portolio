<!DOCTYPE html>
<html lang="en" data-site-base="/">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achievements</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/achievements.css"> <!-- New stylesheet -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Fira+Code:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- CDN for marked.js to parse Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div id="header-placeholder"></div>

    <main>
        <section class="achievements-section">
            <div class="achievements-container">
                <h1 class="section-title">./achievements</h1>
                <div class="achievements-toolbar">
                    <div class="achievements-filters" id="achievement-filters"></div>
                    <div class="achievements-sort">
                        <label for="achievement-sort">Sort</label>
                        <select id="achievement-sort" aria-label="Sort achievements">
                            <option value="newest">Newest</option>
                            <option value="oldest">Oldest</option>
                        </select>
                    </div>
                </div>
                <div id="achievements-grid" class="achievements-grid">
                    <!-- Achievement cards will be injected here by JavaScript -->
                </div>
            </div>
        </section>
    </main>

    <!-- Modal Structure (hidden by default) -->
    <div id="achievement-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button id="modal-close" class="modal-close-btn">&times;</button>
            <div id="modal-body" class="modal-body-content">
                <!-- Markdown content will be injected here -->
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/componentLoader.js" defer></script>
    <script src="../assets/js/main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.getElementById('achievements-grid');
            const modal = document.getElementById('achievement-modal');
            const modalBody = document.getElementById('modal-body');
            const modalCloseBtn = document.getElementById('modal-close');
            const filtersContainer = document.getElementById('achievement-filters');
            const sortSelect = document.getElementById('achievement-sort');

            if (!grid || !modal) return;

            // Fetch achievements from JSON data file
            let achievementsData = [];
            try {
                const response = await fetch('../data/achievements.json');
                if (!response.ok) throw new Error('Failed to load achievements');
                achievementsData = await response.json();
            } catch (error) {
                console.error('Error loading achievements:', error);
                grid.innerHTML = '<p style="font-family: \'Fira Code\';">Failed to load achievements. Please try again later.</p>';
                return;
            }

            const parseAchievementDate = (value) => {
                if (!value) return 0;
                const direct = Date.parse(value);
                if (!Number.isNaN(direct)) return direct;
                const withDay = Date.parse(`${value} 1`);
                return Number.isNaN(withDay) ? 0 : withDay;
            };

            let activeIssuer = 'All';

            const buildFilters = () => {
                if (!filtersContainer) return;
                const issuers = achievementsData
                    .map(item => item.issuedBy)
                    .filter(Boolean);
                const uniqueIssuers = Array.from(new Set(issuers)).sort();
                const allFilters = ['All', ...uniqueIssuers];

                filtersContainer.innerHTML = allFilters.map(issuer => `
                    <button class="filter-chip ${issuer === activeIssuer ? 'active' : ''}" data-issuer="${issuer}" aria-pressed="${issuer === activeIssuer}">
                        ${issuer}
                    </button>
                `).join('');
            };

            const renderAchievements = () => {
                if (!achievementsData.length) {
                    grid.innerHTML = '<p style="font-family: \'Fira Code\';">No achievements listed yet.</p>';
                    return;
                }

                const filtered = activeIssuer === 'All'
                    ? achievementsData
                    : achievementsData.filter(item => item.issuedBy === activeIssuer);

                const sortOrder = sortSelect ? sortSelect.value : 'newest';
                const sorted = [...filtered].sort((a, b) => {
                    const aDate = parseAchievementDate(a.date);
                    const bDate = parseAchievementDate(b.date);
                    return sortOrder === 'oldest' ? aDate - bDate : bDate - aDate;
                });

                const cardsHtml = sorted.map(achievement => `
                    <div class="achievement-card" data-id="${achievement.id}">
                        <img src="../${achievement.image}" alt="${achievement.title}" class="card-image">
                        <div class="card-body">
                            <div class="card-title">${achievement.title}</div>
                            <div class="card-meta">
                                <span class="meta-item"><i class="far fa-calendar"></i> ${achievement.date || 'N/A'}</span>
                                <span class="meta-item"><i class="fas fa-building-columns"></i> ${achievement.issuedBy || 'N/A'}</span>
                            </div>
                        </div>
                    </div>
                `).join('');

                grid.innerHTML = cardsHtml;
            };

            buildFilters();
            renderAchievements();

            if (filtersContainer) {
                filtersContainer.addEventListener('click', (event) => {
                    const chip = event.target.closest('.filter-chip');
                    if (!chip) return;
                    activeIssuer = chip.getAttribute('data-issuer') || 'All';
                    filtersContainer.querySelectorAll('.filter-chip').forEach(button => {
                        const isActive = button.getAttribute('data-issuer') === activeIssuer;
                        button.classList.toggle('active', isActive);
                        button.setAttribute('aria-pressed', String(isActive));
                    });
                    renderAchievements();
                });
            }

            if (sortSelect) {
                sortSelect.addEventListener('change', renderAchievements);
            }

            // --- 2. Setup Modal Logic ---
            grid.addEventListener('click', async (event) => {
                const card = event.target.closest('.achievement-card');
                if (!card) return;
                const targetId = card.getAttribute('data-id');
                const achievement = achievementsData.find(item => item.id === targetId);
                if (!achievement) return;

                let descriptionHtml = '';
                if (achievement.descriptionPath) {
                    try {
                        const mdResponse = await fetch(`../${achievement.descriptionPath}`);
                        if (mdResponse.ok) {
                            const mdText = await mdResponse.text();
                            descriptionHtml = marked.parse(mdText);
                        }
                    } catch (error) {
                        console.warn('Failed to load markdown description:', error);
                    }
                }

                if (!descriptionHtml && achievement.description) {
                    descriptionHtml = `<p>${achievement.description}</p>`;
                }

                // Build modal content from JSON data
                const modalContent = `
                    <img src="../${achievement.image}" alt="${achievement.title}" class="modal-main-image">
                    <h1>${achievement.title}</h1>
                    <p><strong>Date:</strong> ${achievement.date || 'N/A'}</p>
                    <p><strong>Issued By:</strong> ${achievement.issuedBy || 'N/A'}</p>
                    ${descriptionHtml}
                    ${achievement.credentialId ? `<p><strong>Credential ID:</strong> ${achievement.credentialId}</p>` : ''}
                    ${achievement.credentialLink ? `<p><a href="${achievement.credentialLink}" target="_blank" rel="noopener">View Certificate</a></p>` : ''}
                `;

                modalBody.innerHTML = modalContent;
                modal.style.display = 'flex';
            });

            // Function to close the modal
            const closeModal = () => {
                modal.style.display = 'none';
                modalBody.innerHTML = ''; // Clear content
            };

            // Event listeners to close the modal
            modalCloseBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (event) => {
                // Close if the overlay (the modal itself) is clicked, but not its children
                if (event.target === modal) {
                    closeModal();
                }
            });
        });
    </script>
</body>

</html>
